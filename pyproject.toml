[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nltopt"
version = "0.0.1"
description = "Manufacturable design of nonlinear structural dynamics: SSM reduction + fiber-steering, coupling PyHB and wavetopo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joshua R. Tempelman" }]
keywords = [
    "spectral-submanifolds", "nonlinear-dynamics", "backbone-curve",
    "topology-optimization", "fiber-steering", "composites",
    "manufacturability", "adjoint", "reduced-order-models",
]
# The SSM/EPMC layer additionally needs the author's harmonic-balance package PyHB (import name
# `pyhb`; NOT the unrelated PyPI package of that name). It is not public; install it from a local
# copy (pip install -e ../PyHB). The relaxed evaluator and paper_numbers.py run without it.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.4"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["nltopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
